[General]
# QML_XHR_ALLOW_FILE_READ: lets the theme read the battery level from /sys (the top bar's battery chip).
# This setting replaces the whole list, so it repeats sddm-wayland-plasma's own entry
# (/usr/lib/sddm/sddm.conf.d/plasma-wayland.conf); keep that in if the package changes it
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QML_XHR_ALLOW_FILE_READ=1

[Theme]
Current=Ninomae
CursorTheme=BreezeX-RosePine-Linux
CursorSize=24

[Wayland]
# Same command as sddm-wayland-plasma's, but with a software cursor: the hardware cursor plane fails on this
# amdgpu + ultrawide setup ("kwin_wayland_drm: Failed to create framebuffer"), leaving no visible pointer
CompositorCommand=env KWIN_FORCE_SW_CURSOR=1 kwin_wayland --no-global-shortcuts --no-lockscreen --inputmethod plasma-keyboard --locale1
