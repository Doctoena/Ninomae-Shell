# Colours: from the current wallpaper, written by Quickshell's applycolor.sh. Fish also prints them as
# terminal sequences, which updates windows already open
include ~/.local/state/quickshell/user/generated/terminal/kitty-colors.conf

# Cursor
cursor_shape 	      underline
shell_integration     no-cursor

# Transparency (blur handled by Hyprland compositor)
background_opacity    0.92
remember_window_size  no

# Fonts
font_family           family="JetBrainsMono Nerd Font"
bold_font             auto
italic_font           auto
bold_italic_font      auto
