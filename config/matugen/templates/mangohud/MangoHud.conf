# Ninomae theme for MangoHud, generated by matugen from the wallpaper (config/matugen/config.toml).
# Like the btop theme: lavender (primary) for labels, pink (tertiary) for the frame-time graph, salmon
# (error) when the frame rate drops. MangoHud reloads this file on its own while a game runs.
# Turn it on per game in the launcher: Launch options → MangoHud. Shift_R+F12 hides/shows it in game.
# The font path's @HOME@ is filled in by the template's post_hook (MangoHud needs a full path).

# ── Layout: one compact row along the top left ──
horizontal
hud_compact
position=top-left
offset_x=12
offset_y=12
round_corners=12
table_columns=14
font_file=@HOME@/.local/share/fonts/TTF/JetBrainsMonoNerdFont-Regular.ttf
font_size=18
toggle_hud=Shift_R+F12

# ── What it shows ──
fps
fps_color_change
fps_value=45,90
frametime
frame_timing
gpu_stats
gpu_temp
cpu_stats
cpu_temp
ram
vram
battery
battery_icon

# ── Colours ──
background_color={{colors.surface_container.default.hex_stripped}}
background_alpha=0.72
text_color={{colors.on_surface.default.hex_stripped}}
text_outline=0
# Labels (GPU, CPU, VRAM, RAM…): the theme's lavender, a step apart so they read as separate
gpu_color={{colors.primary.default.hex_stripped}}
cpu_color={{colors.secondary.default.hex_stripped}}
vram_color={{colors.primary.default.hex_stripped}}
ram_color={{colors.secondary.default.hex_stripped}}
engine_color={{colors.tertiary.default.hex_stripped}}
battery_color={{colors.secondary.default.hex_stripped}}
io_color={{colors.secondary.default.hex_stripped}}
frametime_color={{colors.tertiary.default.hex_stripped}}
# Frame rate under 45 / under 90 / above: salmon, pink, lavender
fps_color={{colors.error.default.hex_stripped}},{{colors.tertiary.default.hex_stripped}},{{colors.primary.default.hex_stripped}}
# Load: the same three steps at 60% and 90%
gpu_load_change
cpu_load_change
gpu_load_value=60,90
cpu_load_value=60,90
gpu_load_color={{colors.primary.default.hex_stripped}},{{colors.tertiary.default.hex_stripped}},{{colors.error.default.hex_stripped}}
cpu_load_color={{colors.primary.default.hex_stripped}},{{colors.tertiary.default.hex_stripped}},{{colors.error.default.hex_stripped}}
